<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>June 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Serif+Display&family=Playfair+Display:ital,wght@1,400;1,600&family=Cormorant+Garamond:ital,wght@0,300;1,400&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #f2ede8;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      min-height: 100%; gap: 32px;
      overflow: hidden;
    }

    /* ── CALENDAR ── */
    .label {
      font-weight: 300; font-size: 0.7rem; letter-spacing: 4px;
      text-transform: uppercase; color: #b5a8c0;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .surprise {
      font-family: 'Playfair Display', serif; font-style: italic;
      font-size: 1.9rem; color: #3d3445; letter-spacing: 0.5px;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .calendar {
      background: #faf7f4; border-radius: 20px; width: 400px;
      overflow: hidden; box-shadow: 0 2px 40px rgba(160,140,180,0.1);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .calendar-header { padding: 36px 36px 28px; border-bottom: 1px solid #ede8e2; }
    .calendar-header h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 2.4rem; font-weight: 400; color: #3d3445; line-height: 1;
    }
    .calendar-header span {
      display: block; margin-top: 6px; font-size: 0.72rem;
      color: #c0b0d0; letter-spacing: 2px; text-transform: uppercase;
    }
    .weekdays { display: grid; grid-template-columns: repeat(7,1fr); padding: 20px 24px 8px; }
    .weekdays span {
      text-align: center; font-size: 0.65rem; font-weight: 500;
      color: #c4b8d2; letter-spacing: 1.5px; text-transform: uppercase;
    }
    .days { display: grid; grid-template-columns: repeat(7,1fr); padding: 8px 24px 28px; gap: 4px; }
    .day {
      display: flex; justify-content: center; align-items: center;
      height: 46px; border-radius: 10px; font-size: 0.88rem;
      font-weight: 400; color: #5a4e6a; cursor: default; transition: background 0.15s;
    }
    .day:hover:not(.empty):not(.highlighted) { background: #ede8f5; }
    .empty { pointer-events: none; }
    .weekend { color: #c9bdd8; }
    .highlighted {
      background: #9b7ec8; color: #faf7f4; font-weight: 500;
      cursor: pointer; position: relative; transition: background 0.2s, transform 0.2s;
    }
    .highlighted:hover { background: #8a6db8; transform: scale(1.1); }
    .highlighted::after {
      content: ''; position: absolute; bottom: 7px;
      width: 3px; height: 3px; background: rgba(255,255,255,0.6); border-radius: 50%;
    }
    .calendar-footer {
      padding: 18px 36px; border-top: 1px solid #ede8e2;
      display: flex; align-items: center; gap: 10px;
    }
    .footer-dot { width: 8px; height: 8px; border-radius: 50%; background: #9b7ec8; }
    .footer-text { font-size: 0.75rem; color: #b5a8c0; letter-spacing: 0.5px; }
    .fade-out { opacity: 0 !important; transform: scale(0.95) !important; pointer-events: none; }

    /* ── CONFETTI ── */
    #confetti-canvas {
      position: fixed; inset: 0; pointer-events: none; z-index: 50;
      opacity: 0; transition: opacity 0.3s;
    }
    #confetti-canvas.active { opacity: 1; }

    /* ── STICKERS ── */
    .sticker {
      position: fixed; font-size: 2rem; pointer-events: none; z-index: 60;
      opacity: 0; transform: scale(0); animation: stickerPop 2.4s ease forwards;
    }
    @keyframes stickerPop {
      0%   { opacity: 0; transform: scale(0) rotate(-15deg); }
      18%  { opacity: 1; transform: scale(1.25) rotate(8deg); }
      32%  { opacity: 1; transform: scale(1) rotate(-4deg); }
      70%  { opacity: 1; transform: scale(1) rotate(var(--rot)) translateY(var(--drift)); }
      100% { opacity: 0; transform: scale(0.7) rotate(var(--rot)) translateY(calc(var(--drift) - 40px)); }
    }

    /* ── ENVELOPE VIEW ── */
    #envelope-view {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 20px; opacity: 0; pointer-events: none;
      transition: opacity 0.6s ease 0.3s; z-index: 40;
      overflow-y: auto; padding: 24px 0;
    }
    #envelope-view.visible { opacity: 1; pointer-events: all; }

    .env-title {
      font-family: 'Playfair Display', serif; font-style: italic;
      font-size: 1.9rem; color: #3d3445; letter-spacing: 0.5px; text-align: center;
      opacity: 0; transform: translateY(-14px);
      transition: opacity 0.6s ease 0.9s, transform 0.6s ease 0.9s;
    }
    #envelope-view.visible .env-title { opacity: 1; transform: translateY(0); }

    /* ── ENVELOPE LIST (3 stacked) ── */
    .envelope-list {
      display: flex; flex-direction: column; align-items: center; gap: 16px;
      opacity: 0; transform: translateY(18px);
      transition: opacity 0.7s ease 1.1s, transform 0.7s ease 1.1s;
    }
    #envelope-view.visible .envelope-list { opacity: 1; transform: translateY(0); }

    .envelope-item {
      display: flex; flex-direction: column; align-items: flex-start; gap: 5px;
    }

    .envelope-from {
      font-family: 'Cormorant Garamond', serif; font-style: italic;
      font-size: 0.78rem; color: #b0a090; letter-spacing: 1px;
      padding-left: 6px;
      transition: color 0.2s;
    }
    .envelope-item:hover .envelope-from { color: #7a6858; }

    /* ── ENVELOPE WRAP ── */
    .envelope-wrap {
      position: relative; width: 300px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .envelope-wrap:hover { transform: translateY(-3px); }

    /* ── ENVELOPE BODY ── */
    .envelope {
      position: relative; z-index: 2;
      width: 300px; height: 162px;
      background: #f9f3e8;
      border-radius: 4px 4px 6px 6px;
      box-shadow: 0 6px 24px rgba(120,90,100,0.12), 0 1px 4px rgba(120,90,100,0.07);
      border: 1px solid #e0d4c0;
      overflow: hidden;
    }

    .envelope::before {
      content: ''; position: absolute; bottom: 0; left: 0;
      border-style: solid; border-width: 0 0 81px 150px;
      border-color: transparent transparent #ede3d0 transparent;
    }
    .envelope::after {
      content: ''; position: absolute; bottom: 0; right: 0;
      border-style: solid; border-width: 81px 0 0 150px;
      border-color: transparent transparent transparent #e8dccb;
    }

    /* ── FLAP ── */
    .flap {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 86px;
      background: #ede0c8;
      clip-path: polygon(0% 0%, 100% 0%, 50% 100%);
      transform-origin: top center;
      z-index: 3;
      backface-visibility: hidden;
      transition: transform 0.75s cubic-bezier(0.4, 0, 0.2, 1);
      filter: drop-shadow(0 2px 2px rgba(120,90,80,0.08));
    }
    .flap.open { transform: perspective(500px) rotateX(-180deg); }

    .flap-crease {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 86px;
      clip-path: polygon(0% 0%, 100% 0%, 50% 100%);
      background: linear-gradient(to bottom right, rgba(200,185,155,0.3) 0%, rgba(200,185,155,0) 60%);
      pointer-events: none; z-index: 4;
    }

    /* postmark */
    .postmark {
      position: absolute; top: 14px; right: 18px;
      width: 46px; height: 46px; border-radius: 50%;
      border: 1.5px dashed #c9b89a;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
      z-index: 5;
    }
    .postmark-line { width: 24px; height: 1px; background: #c9b89a; }
    .postmark-text { font-size: 0.38rem; letter-spacing: 1.5px; color: #c9b89a; text-transform: uppercase; }

    /* stamp */
    .stamp {
      position: absolute; top: 12px; right: 72px;
      width: 32px; height: 40px;
      border: 1.5px solid #c9a8e0; z-index: 5;
      display: flex; align-items: center; justify-content: center; font-size: 0.95rem;
    }
    .stamp::before { content: ''; position: absolute; inset: 3px; border: 1px solid #c9a8e0; opacity: 0.5; }
    .stamp-lucia { background: #f0d8e8; border-color: #d8a8c8; }
    .stamp-lucia::before { border-color: #d8a8c8; }
    .stamp-di    { background: #d8e8f4; border-color: #a8c4e0; }
    .stamp-di::before    { border-color: #a8c4e0; }
    .stamp-chumby{ background: #e8ead4; border-color: #b8bc90; }
    .stamp-chumby::before{ border-color: #b8bc90; }

    /* ── WAX SEAL ── */
    .wax-seal {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10; width: 56px; height: 56px;
      cursor: pointer;
      transition: transform 0.25s ease, opacity 0.4s ease;
    }
    .wax-seal:hover:not(.cracked) { transform: translate(-50%, -50%) scale(1.12); }
    .wax-seal.cracked { opacity: 0 !important; pointer-events: none; }
    .wax-heart { width: 56px; height: 56px; filter: drop-shadow(0 3px 8px rgba(0,0,0,0.2)); }
    .wax-heart svg { width: 56px; height: 56px; }

    /* ── SUBTITLE ── */
    .env-subtitle {
      font-family: 'Cormorant Garamond', serif; font-style: italic;
      font-size: 1.2rem; color: #8a7898; letter-spacing: 1px; text-align: center;
      opacity: 0; transform: translateY(10px);
      transition: opacity 0.6s ease 1.6s, transform 0.6s ease 1.6s;
    }
    #envelope-view.visible .env-subtitle { opacity: 1; transform: translateY(0); }

    /* ── DONE BUTTON ── */
    .done-btn {
      font-family: 'Playfair Display', serif; font-style: italic;
      font-size: 1.15rem; color: #9b7ec8;
      background: none; border: none; cursor: pointer;
      letter-spacing: 1px;
      opacity: 0; transform: translateY(10px);
      transition: opacity 0.7s ease, transform 0.7s ease, color 0.2s;
      pointer-events: none;
    }
    .done-btn.show { opacity: 1; transform: translateY(0); pointer-events: all; }
    .done-btn:hover { color: #7a5ea8; }

    /* ── FINAL PAGE ── */
    #final-page {
      position: fixed; inset: 0; background: #f2ede8;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 28px; z-index: 100;
      opacity: 0; pointer-events: none;
      transition: opacity 0.7s ease;
      overflow: hidden;
    }
    #final-page.visible { opacity: 1; pointer-events: all; }

    .final-title {
      font-family: 'Playfair Display', serif; font-style: italic;
      font-size: 2.6rem; color: #3d3445; text-align: center; letter-spacing: 0.5px;
      opacity: 0; transform: translateY(-18px);
      transition: opacity 0.6s ease 0.5s, transform 0.6s ease 0.5s;
      position: relative; z-index: 2;
    }
    #final-page.visible .final-title { opacity: 1; transform: translateY(0); }

    .final-frame {
      padding: 14px 14px 44px;
      background: #fdfaf3;
      box-shadow: 0 12px 48px rgba(80,60,60,0.2), 0 2px 8px rgba(80,60,60,0.08);
      border: 1px solid #e8dfc8;
      opacity: 0; transform: scale(0.92);
      transition: opacity 0.7s ease 0.7s, transform 0.7s cubic-bezier(0.34,1.4,0.64,1) 0.7s;
      position: relative; z-index: 2;
    }
    #final-page.visible .final-frame { opacity: 1; transform: scale(1); }

    .final-photo {
      width: 300px; height: 360px; object-fit: cover; display: block;
    }
    .final-photo-placeholder {
      width: 300px; height: 360px; background: #ede8e0;
      border: 1px dashed #d0c8b8;
      display: flex; align-items: center; justify-content: center;
    }
    .final-photo-placeholder span {
      font-family: 'Cormorant Garamond', serif; font-style: italic;
      font-size: 0.82rem; color: #c0b8a8; letter-spacing: 0.5px;
    }

    /* balloon stickers float upward */
    .balloon {
      position: absolute; pointer-events: none; z-index: 1;
      opacity: 0; animation: floatUp linear forwards;
    }
    @keyframes floatUp {
      0%   { opacity: 0; transform: translate(0, 0) rotate(-6deg); }
      8%   { opacity: 1; }
      25%  { transform: translate(-18px, -25vh) rotate(6deg); }
      50%  { transform: translate(12px,  -52vh) rotate(-4deg); }
      75%  { transform: translate(-10px, -77vh) rotate(5deg); }
      92%  { opacity: 1; }
      100% { opacity: 0; transform: translate(6px, -108vh) rotate(-2deg); }
    }

    /* ── BACK BUTTON ── */
    .back-btn {
      position: fixed; top: 28px; left: 28px;
      font-family: 'DM Sans', sans-serif; font-size: 0.7rem; font-weight: 400;
      letter-spacing: 3px; text-transform: uppercase; color: #b5a8c0;
      background: none; border: none; cursor: pointer;
      opacity: 0; transition: opacity 0.4s ease, color 0.2s;
      z-index: 200;
    }
    #envelope-view.visible .back-btn { opacity: 1; transition-delay: 1.8s; }
    #letter-modal.visible .back-btn  { opacity: 1; transition-delay: 0.3s; }
    .back-btn:hover { color: #7a6a8a; }

    /* ── LETTER MODAL ── */
    #letter-modal {
      position: fixed; inset: 0; background: #f2ede8;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 90;
      opacity: 0; pointer-events: none;
      transition: opacity 0.4s ease;
    }
    #letter-modal.visible { opacity: 1; pointer-events: all; }

    .letter-modal-inner {
      display: flex; flex-direction: row; align-items: flex-start;
      gap: 36px;
      transform: translateY(20px);
      transition: transform 0.5s cubic-bezier(0.22, 1.1, 0.36, 1) 0.1s;
    }
    #letter-modal.visible .letter-modal-inner { transform: translateY(0); }

    /* photo column */
    .letter-photo-col {
      flex-shrink: 0;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
    }
    .letter-photo {
      width: 210px; height: 260px; object-fit: cover;
      border-radius: 8px;
      box-shadow: 0 6px 28px rgba(80,60,60,0.18);
    }
    .letter-photo-placeholder {
      width: 210px; height: 260px;
      background: #ede8e0; border-radius: 8px;
      border: 1px dashed #d0c8b8;
      display: flex; align-items: center; justify-content: center;
    }
    .letter-photo-placeholder span {
      font-family: 'Cormorant Garamond', serif; font-style: italic;
      font-size: 0.82rem; color: #c0b8a8; letter-spacing: 0.5px;
    }
    .letter-photo-caption {
      font-family: 'Cormorant Garamond', serif; font-style: italic;
      font-size: 0.82rem; color: #b0a090; letter-spacing: 1px;
    }

    /* letter card */
    .letter-card {
      background: #fdfaf3;
      border: 1px solid #ddd4b8;
      border-radius: 2px;
      padding: 26px 28px 30px;
      width: 310px;
      position: relative;
      box-shadow: 0 2px 16px rgba(100,80,60,0.08);
    }
    .letter-card::before {
      content: '';
      position: absolute;
      top: 60px; left: 22px; right: 22px; bottom: 44px;
      background-image: repeating-linear-gradient(
        to bottom, transparent, transparent 27px, #e8dfc8 27px, #e8dfc8 28px
      );
      pointer-events: none;
    }
    .letter-greeting {
      font-family: 'Cormorant Garamond', serif; font-style: italic;
      font-size: 1rem; color: #6b5a48; margin-bottom: 14px;
      position: relative; z-index: 1;
    }
    .letter-body {
      font-family: 'Cormorant Garamond', serif; font-style: italic;
      font-size: 0.88rem; color: #7a6858; line-height: 1.85; margin-bottom: 18px;
      position: relative; z-index: 1;
    }
    .letter-sign {
      font-family: 'Cormorant Garamond', serif; font-style: italic;
      font-size: 0.88rem; color: #8a7260; text-align: right;
      position: relative; z-index: 1;
    }

    /* ── MOBILE ── */
    @media (max-width: 600px) {

      /* body / layout */
      body { gap: 18px; overflow-y: auto; }

      /* calendar page */
      .surprise { font-size: 1.4rem; }
      .label    { font-size: 0.62rem; letter-spacing: 3px; }

      .calendar {
        width: min(400px, 92vw);
        border-radius: 14px;
      }
      .calendar-header { padding: 22px 20px 16px; }
      .calendar-header h1 { font-size: 1.9rem; }
      .weekdays { padding: 14px 10px 6px; }
      .days     { padding: 6px 10px 18px; gap: 2px; }
      .day      { height: 40px; font-size: 0.8rem; border-radius: 8px; }
      .calendar-footer { padding: 14px 20px; }
      .footer-text { font-size: 0.7rem; }

      /* envelope view — allow vertical scroll */
      #envelope-view {
        justify-content: flex-start;
        padding: 56px 0 36px;
        gap: 14px;
      }

      .env-title  { font-size: 1.35rem; padding: 0 16px; }
      .env-subtitle { font-size: 1rem; }
      .done-btn   { font-size: 1rem; }

      /* envelopes — keep 300px, they fit on ≥320px screens */
      .envelope-list { gap: 12px; }
      .envelope-from { font-size: 0.72rem; }

      /* back button — tuck closer to edge */
      .back-btn { top: 14px; left: 14px; font-size: 0.62rem; }

      /* ── LETTER MODAL — stack vertically ── */
      #letter-modal {
        justify-content: flex-start;
        overflow-y: auto;
        padding-top: 56px;
        padding-bottom: 24px;
      }

      .letter-modal-inner {
        flex-direction: column;
        align-items: center;
        gap: 20px;
        width: 92vw;
      }

      /* smaller photo */
      .letter-photo            { width: 140px; height: 174px; border-radius: 6px; }
      .letter-photo-placeholder { width: 140px; height: 174px; border-radius: 6px; }

      /* letter card full-width */
      .letter-card {
        width: 92vw;
        padding: 20px 18px 24px;
      }
      .letter-card::before {
        top: 52px; left: 18px; right: 18px; bottom: 36px;
      }

      /* ── FINAL PAGE ── */
      #final-page { gap: 20px; }

      .final-title { font-size: 1.75rem; padding: 0 16px; }

      .final-frame { padding: 10px 10px 32px; }
      .final-photo {
        width: min(260px, 82vw);
        height: calc(min(260px, 82vw) * 1.2);
      }
      .final-photo-placeholder {
        width: min(260px, 82vw);
        height: calc(min(260px, 82vw) * 1.2);
      }
    }
  </style>
</head>
<body>

  <canvas id="confetti-canvas"></canvas>

  <!-- CALENDAR -->
  <p class="surprise" id="cal-surprise">Surprise!!</p>
  <p class="label" id="cal-label">2026</p>
  <div class="calendar" id="calendar">
    <div class="calendar-header">
      <h1>June</h1>
      <span>12th · marked</span>
    </div>
    <div class="weekdays">
      <span>Su</span><span>Mo</span><span>Tu</span><span>We</span>
      <span>Th</span><span>Fr</span><span>Sa</span>
    </div>
    <div class="days" id="days"></div>
    <div class="calendar-footer">
      <div class="footer-dot"></div>
      <p class="footer-text">June 12 — special day</p>
    </div>
  </div>

  <!-- ENVELOPE VIEW -->
  <div id="envelope-view">
    <button class="back-btn" onclick="goBack()">← back</button>

    <h2 class="env-title">Feliz Cumpleaños Gemita !!</h2>

    <div class="envelope-list">

      <!-- LUCIA -->
      <div class="envelope-item">
        <span class="envelope-from">from Lucia</span>
        <div class="envelope-wrap" onclick="openLetter('lucia')">
          <div class="envelope">
            <div class="flap" id="flap-lucia"></div>
            <div class="flap-crease"></div>
            <div class="postmark">
              <div class="postmark-line"></div>
              <div class="postmark-text">Jun 12</div>
              <div class="postmark-line"></div>
            </div>
            <div class="stamp stamp-lucia">♡</div>
          </div>
          <div class="wax-seal" id="seal-lucia">
            <div class="wax-heart">
              <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                <defs>
                  <radialGradient id="waxL" cx="40%" cy="35%" r="60%">
                    <stop offset="0%" stop-color="#d4748a"/>
                    <stop offset="60%" stop-color="#b85470"/>
                    <stop offset="100%" stop-color="#8f3050"/>
                  </radialGradient>
                </defs>
                <path d="M32 54 C32 54 8 38 8 22 C8 13.2 14.7 7 22 7 C26.5 7 30.5 9.3 32 12.8 C33.5 9.3 37.5 7 42 7 C49.3 7 56 13.2 56 22 C56 38 32 54 32 54Z" fill="url(#waxL)"/>
                <path d="M22 12 C18 14 15 18 15 23" stroke="rgba(255,255,255,0.25)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                <text x="32" y="34" text-anchor="middle" font-family="Cormorant Garamond,serif" font-style="italic" font-size="16" fill="rgba(255,255,255,0.92)">L</text>
              </svg>
            </div>
          </div>
        </div>
      </div>

      <!-- DI -->
      <div class="envelope-item">
        <span class="envelope-from">from Di</span>
        <div class="envelope-wrap" onclick="openLetter('di')">
          <div class="envelope">
            <div class="flap" id="flap-di"></div>
            <div class="flap-crease"></div>
            <div class="postmark">
              <div class="postmark-line"></div>
              <div class="postmark-text">Jun 12</div>
              <div class="postmark-line"></div>
            </div>
            <div class="stamp stamp-di">♡</div>
          </div>
          <div class="wax-seal" id="seal-di">
            <div class="wax-heart">
              <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                <defs>
                  <radialGradient id="waxD" cx="40%" cy="35%" r="60%">
                    <stop offset="0%" stop-color="#74a4d4"/>
                    <stop offset="60%" stop-color="#4878b8"/>
                    <stop offset="100%" stop-color="#2a4e88"/>
                  </radialGradient>
                </defs>
                <path d="M32 54 C32 54 8 38 8 22 C8 13.2 14.7 7 22 7 C26.5 7 30.5 9.3 32 12.8 C33.5 9.3 37.5 7 42 7 C49.3 7 56 13.2 56 22 C56 38 32 54 32 54Z" fill="url(#waxD)"/>
                <path d="M22 12 C18 14 15 18 15 23" stroke="rgba(255,255,255,0.25)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                <text x="32" y="34" text-anchor="middle" font-family="Cormorant Garamond,serif" font-style="italic" font-size="16" fill="rgba(255,255,255,0.92)">D</text>
              </svg>
            </div>
          </div>
        </div>
      </div>

      <!-- CHUMBY -->
      <div class="envelope-item">
        <span class="envelope-from">from Chumby</span>
        <div class="envelope-wrap" onclick="openLetter('chumby')">
          <div class="envelope">
            <div class="flap" id="flap-chumby"></div>
            <div class="flap-crease"></div>
            <div class="postmark">
              <div class="postmark-line"></div>
              <div class="postmark-text">Jun 12</div>
              <div class="postmark-line"></div>
            </div>
            <div class="stamp stamp-chumby">♡</div>
          </div>
          <div class="wax-seal" id="seal-chumby">
            <div class="wax-heart">
              <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                <defs>
                  <radialGradient id="waxC" cx="40%" cy="35%" r="60%">
                    <stop offset="0%" stop-color="#c4a060"/>
                    <stop offset="60%" stop-color="#a07838"/>
                    <stop offset="100%" stop-color="#704e18"/>
                  </radialGradient>
                </defs>
                <path d="M32 54 C32 54 8 38 8 22 C8 13.2 14.7 7 22 7 C26.5 7 30.5 9.3 32 12.8 C33.5 9.3 37.5 7 42 7 C49.3 7 56 13.2 56 22 C56 38 32 54 32 54Z" fill="url(#waxC)"/>
                <path d="M22 12 C18 14 15 18 15 23" stroke="rgba(255,255,255,0.25)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                <text x="32" y="34" text-anchor="middle" font-family="Cormorant Garamond,serif" font-style="italic" font-size="16" fill="rgba(255,255,255,0.92)">C</text>
              </svg>
            </div>
          </div>
        </div>
      </div>

    </div>

    <p class="env-subtitle">Te queremos mucho</p>
    <button class="done-btn" id="done-btn" onclick="showFinalPage()">Done.</button>
  </div>

  <!-- FINAL PAGE -->
  <div id="final-page">
    <h1 class="final-title">Disfruta de tu dia baby!</h1>
    <div class="final-frame">
      <img class="final-photo" id="final-photo" src="group.jpg" alt="Las cuatro"
           onerror="this.style.display='none'; document.getElementById('final-placeholder').style.display='flex';" />
      <div class="final-photo-placeholder" id="final-placeholder" style="display:none">
        <span>foto próximamente</span>
      </div>
    </div>
  </div>

  <!-- LETTER MODAL -->
  <div id="letter-modal">
    <button class="back-btn" onclick="closeLetter()">← back</button>
    <div class="letter-modal-inner">
      <div class="letter-photo-col">
        <img  class="letter-photo" id="modal-photo" src="" alt="" style="display:none"
              onerror="this.style.display='none'; document.getElementById('modal-placeholder').style.display='flex';" />
        <div  class="letter-photo-placeholder" id="modal-placeholder">
          <span>foto próximamente</span>
        </div>
        <span class="letter-photo-caption" id="modal-caption"></span>
      </div>
      <div class="letter-card">
        <p class="letter-greeting" id="modal-greeting"></p>
        <p class="letter-body"    id="modal-body"></p>
        <p class="letter-sign"    id="modal-sign"></p>
      </div>
    </div>
  </div>

  <script>
    /* ── LETTER DATA ── */
    const LETTERS = {
      lucia: {
        photo:    'lucia.jpeg',
        caption:  'Lucia & Gemita',
        greeting: 'Queridaisima Umpalumpa,',
        body:     'Puede que esto sea una ñoñada, pero sabes que estas cosas en el fondo me encantan. \nHoy es tu cumple y (aunque a ti te parezca raro jajaja) todos los años doy gracias a Dios por ponerte en mi camino.\nMuchas veces lo pienso y se que hoy no seria quien soy de no ser por ti, me has hecho crecer como persona y como amiga y siempre te querre por ello. Por que me has demostrado lo que es una verdadera "hermana de otra sangre" y me encanta. \n\n Y no puedo esperar para ver que nos depara el futuro, pero estoy tranquila porque se que sea lo que sea estaras a mi lado, \n y yo al tuyo, eso no va a cambiar lo prometo, aqui estare siempre para ti, que para eso soy tu mujer ;). \n\n Te quiero muchisimo gemita espero que lo sepas y soy muy feliz de poder celebrar este dia a tu lado un año mas.',
        sign:     'Con todo el cariño, Tu mujer duh♡'
      },
      di: {
        photo:    null,
        caption:  'Di & Gemita',
        greeting: 'Querida Gemita,',
        body:     '[DI — reemplaza este texto con tu mensaje]\n\nHoy es un día muy especial y quería\nque supieras lo mucho que significas\npara mí. Eres de esas personas que\nhacen todo más bonito con su presencia.\n\nEspero que este año te traiga todo\nlo que mereces y mucho más.\n\n[termina con algo tuyo aquí]',
        sign:     'Con mucho amor, ♡ Di'
      },
      chumby: {
        photo:    null,
        caption:  'Chumby & Gemita',
        greeting: 'Querida Gemita,',
        body:     '[CHUMBY — reemplaza este texto con tu mensaje]\n\nNo sé si hay palabras suficientes para\ndecirte todo lo que me alegra tenerte\ncerca. Eres especial de una manera\nque poca gente es.\n\nQue este cumpleaños sea el inicio\nde un año increíble para ti.\n\n[termina con algo tuyo aquí]',
        sign:     'Con cariño, ♡ Chumby'
      }
    };

    /* ── CALENDAR BUILD ── */
    const YEAR = 2026, MONTH = 5, HIGHLIGHT = 12;
    const firstDay  = new Date(YEAR, MONTH, 1).getDay();
    const totalDays = new Date(YEAR, MONTH + 1, 0).getDate();
    const calDays   = document.getElementById('days');

    for (let i = 0; i < firstDay; i++) {
      const b = document.createElement('div'); b.className = 'day empty'; calDays.appendChild(b);
    }
    for (let d = 1; d <= totalDays; d++) {
      const el  = document.createElement('div');
      const dow = (firstDay + d - 1) % 7;
      const cls = ['day'];
      if (d === HIGHLIGHT) { cls.push('highlighted'); el.addEventListener('click', openEnvelope); }
      else if ([0,6].includes(dow)) cls.push('weekend');
      el.className  = cls.join(' ');
      el.textContent = d;
      calDays.appendChild(el);
    }

    /* ── CONFETTI ── */
    const canvas = document.getElementById('confetti-canvas');
    const ctx    = canvas.getContext('2d');
    let confettiPieces = [], confettiRAF = null, confettiRunning = false;
    const COLORS = ['#c9a7e8','#e8b4d0','#f2c98a','#a8d8c0','#f4a8b8','#b8d4f4','#f4e4a8','#d0b8f4','#f4c4a8','#a8c4f4'];

    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    resizeCanvas(); window.addEventListener('resize', resizeCanvas);

    function spawnConfetti(count) {
      for (let i = 0; i < count; i++) {
        confettiPieces.push({
          x: Math.random() * canvas.width, y: -20 - Math.random() * 200,
          w: 6 + Math.random() * 8, h: 3 + Math.random() * 5,
          color: COLORS[Math.floor(Math.random() * COLORS.length)],
          rot: Math.random() * Math.PI * 2, rotSpeed: (Math.random() - 0.5) * 0.12,
          vx: (Math.random() - 0.5) * 2.5, vy: 2.5 + Math.random() * 3.5,
          opacity: 0.85 + Math.random() * 0.15,
          shape: Math.random() < 0.4 ? 'circle' : 'rect',
          life: 1, decay: 0.0008 + Math.random() * 0.0006
        });
      }
    }

    function drawConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      let alive = false;
      for (const p of confettiPieces) {
        p.x += p.vx; p.y += p.vy; p.rot += p.rotSpeed; p.vx *= 0.995; p.life -= p.decay;
        if (p.life <= 0 || p.y > canvas.height + 40) continue;
        alive = true;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.globalAlpha = p.opacity * Math.max(0, p.life); ctx.fillStyle = p.color;
        if (p.shape === 'circle') { ctx.beginPath(); ctx.arc(0,0,p.w/2,0,Math.PI*2); ctx.fill(); }
        else ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
        ctx.restore();
      }
      if (alive) confettiRAF = requestAnimationFrame(drawConfetti);
      else { ctx.clearRect(0,0,canvas.width,canvas.height); canvas.classList.remove('active'); confettiRunning = false; }
    }

    function startConfetti() {
      if (confettiRAF) cancelAnimationFrame(confettiRAF);
      canvas.classList.add('active'); confettiRunning = true; confettiPieces = [];
      spawnConfetti(140); drawConfetti();
      setTimeout(() => { if (confettiRunning) spawnConfetti(60); }, 600);
    }
    function stopConfetti() {
      if (confettiRAF) cancelAnimationFrame(confettiRAF);
      ctx.clearRect(0,0,canvas.width,canvas.height);
      canvas.classList.remove('active'); confettiPieces = []; confettiRunning = false;
    }

    /* ── STICKERS ── */
    const STICKERS = [
      '🏎️','🏁','⚡','🔧','🛞','🏔️','🥾','🎒','⛰️','🗺️','🧗',
      '⛺','🔥','🪵','🌲','🏕️','🌿','☀️','🌊','🍦','🌻','🌞','🍉',
      '💛','💌','🎉','🎊','✨','💫','🫂','🤍','🥂'
    ];
    let stickerIntervalId = null;

    function spawnSticker() {
      const el = document.createElement('div');
      el.className = 'sticker';
      el.textContent = STICKERS[Math.floor(Math.random() * STICKERS.length)];
      const m = 80;
      el.style.left = (m + Math.random() * (window.innerWidth  - m*2)) + 'px';
      el.style.top  = (m + Math.random() * (window.innerHeight - m*2)) + 'px';
      el.style.setProperty('--rot',   ((Math.random()-0.5)*30) + 'deg');
      el.style.setProperty('--drift', -(30 + Math.random()*60) + 'px');
      el.style.fontSize          = (1.6 + Math.random()*1.6) + 'rem';
      el.style.animationDuration = (2  + Math.random()*1.2) + 's';
      el.style.animationDelay    = (Math.random()*0.3) + 's';
      document.body.appendChild(el);
      el.addEventListener('animationend', () => el.remove());
    }

    function startStickers() {
      for (let i = 0; i < 8; i++) setTimeout(spawnSticker, i * 120);
      stickerIntervalId = setInterval(spawnSticker, 380);
      setTimeout(() => { clearInterval(stickerIntervalId); stickerIntervalId = setInterval(spawnSticker, 900); }, 4000);
    }
    function stopStickers() {
      clearInterval(stickerIntervalId); stickerIntervalId = null;
      document.querySelectorAll('.sticker').forEach(s => s.remove());
    }

    /* ── OPEN LETTER (click envelope) ── */
    const openedLetters = new Set();

    function openLetter(name) {
      const seal = document.getElementById('seal-' + name);
      if (seal.classList.contains('cracked')) {
        showModal(name); return;
      }
      seal.classList.add('cracked');
      setTimeout(() => document.getElementById('flap-' + name).classList.add('open'), 250);
      setTimeout(() => showModal(name), 700);
    }

    function showModal(name) {
      const data = LETTERS[name];
      const photo = document.getElementById('modal-photo');
      const placeholder = document.getElementById('modal-placeholder');

      document.getElementById('modal-greeting').textContent = data.greeting;
      document.getElementById('modal-body').innerHTML = data.body.replace(/\n/g, '<br>');
      document.getElementById('modal-sign').textContent = data.sign;
      document.getElementById('modal-caption').textContent = data.caption;

      if (data.photo) {
        photo.src = data.photo;
        photo.style.display = 'block';
        placeholder.style.display = 'none';
      } else {
        photo.style.display = 'none';
        placeholder.style.display = 'flex';
      }

      document.getElementById('letter-modal').classList.add('visible');

      /* track which letters have been read */
      openedLetters.add(name);
      if (openedLetters.size === 3) {
        document.getElementById('done-btn').classList.add('show');
      }
    }

    function closeLetter() {
      document.getElementById('letter-modal').classList.remove('visible');
    }

    /* ── FINAL PAGE ── */
    const BALLOONS = ['🎈','🎂','🥳','🎉','🎊','🎁','🎀','✨','🌟','💐','🎆','🎇','🪅','🫧','⭐','🌈'];
    let balloonIntervalId = null;

    function spawnBalloon() {
      const el = document.createElement('div');
      el.className = 'balloon';
      el.textContent = BALLOONS[Math.floor(Math.random() * BALLOONS.length)];
      el.style.left     = (3 + Math.random() * 94) + 'vw';
      el.style.bottom   = '-60px';
      el.style.fontSize = (1.4 + Math.random() * 2.2) + 'rem';
      const dur = 5 + Math.random() * 5;
      el.style.animationDuration = dur + 's';
      el.style.animationDelay   = (Math.random() * 0.4) + 's';
      document.getElementById('final-page').appendChild(el);
      el.addEventListener('animationend', () => el.remove());
    }

    function startBalloons() {
      for (let i = 0; i < 6; i++) setTimeout(spawnBalloon, i * 200);
      balloonIntervalId = setInterval(spawnBalloon, 500);
    }

    function stopBalloons() {
      clearInterval(balloonIntervalId); balloonIntervalId = null;
      document.querySelectorAll('.balloon').forEach(b => b.remove());
    }

    function showFinalPage() {
      const envView = document.getElementById('envelope-view');
      envView.style.transition = 'opacity 0.5s ease';
      envView.style.opacity    = '0';
      envView.style.pointerEvents = 'none';
      setTimeout(() => {
        envView.classList.remove('visible');
        envView.style.opacity = '';
        envView.style.transition = '';
        envView.style.pointerEvents = '';
        document.getElementById('final-page').classList.add('visible');
        startBalloons();
      }, 500);
    }

    /* ── CALENDAR → ENVELOPE VIEW ── */
    function openEnvelope() {
      const cal = document.getElementById('calendar');
      const lbl = document.getElementById('cal-label');
      const sup = document.getElementById('cal-surprise');
      startConfetti(); startStickers();
      cal.classList.add('fade-out'); lbl.classList.add('fade-out'); sup.classList.add('fade-out');
      setTimeout(() => {
        cal.style.display = 'none'; lbl.style.display = 'none'; sup.style.display = 'none';
        document.getElementById('envelope-view').classList.add('visible');
      }, 480);
    }

    function goBack() {
      stopConfetti(); stopStickers();
      document.getElementById('envelope-view').classList.remove('visible');
      const cal = document.getElementById('calendar');
      const lbl = document.getElementById('cal-label');
      const sup = document.getElementById('cal-surprise');
      setTimeout(() => {
        cal.style.display = ''; lbl.style.display = ''; sup.style.display = '';
        setTimeout(() => {
          cal.classList.remove('fade-out'); lbl.classList.remove('fade-out'); sup.classList.remove('fade-out');
        }, 20);
      }, 700);
    }
  </script>
</body>
</html>
